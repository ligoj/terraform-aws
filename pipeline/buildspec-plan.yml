version: 0.2

env:
  variables:
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"

phases:
  install:
    runtime-versions:
      # npm is required by the lambda_data_api build step of the main stack
      nodejs: 20
    commands:
      - curl -sSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
      - unzip -o -q /tmp/terraform.zip -d /usr/local/bin
      - terraform version
  build:
    commands:
      - terraform init -no-color -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${TF_STATE_REGION}"
      # Deployment values live outside the repository ('profile' must NOT be set in them)
      - if [ -n "${TFVARS_S3_URI}" ]; then aws s3 cp "${TFVARS_S3_URI}" pipeline.auto.tfvars; fi
      - terraform plan -no-color -out=tfplan

# Hand the workspace and the plan file over to the apply stage.
# .terraform is excluded: the apply stage re-runs 'terraform init'
artifacts:
  files:
    - '**/*'
  exclude-paths:
    - '.terraform/**/*'
